<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor INVALSI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            background-color: #f8fafc; 
        }
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .welcome-card { 
            max-width: 680px; 
            margin: 40px auto; 
            padding: 32px; 
            border-radius: 24px; 
            background-color: #ffffff;
            border: 1px solid #f1f5f9; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
        }
        
        /* Streaming animation for mic listening */
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .listening-active {
            animation: pulse-red 2s infinite;
            color: #ef4444 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Endpoint Google Apps Script
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRJ7TMzdam3HuuiiS-VEOXaiku3HybiZbRNf59cShkpcE5AoOh_Si10kU6WFSG3JWkNQ/exec";

        const { useState, useRef, useEffect } = React;

        const SYSTEM_INSTRUCTION = `Sei un tutor esperto INVALSI con rigore visivo assoluto.

REGOLE CRITICHE ANTI-ALLUCINAZIONE (NON DEROGABILI):
1. PROTOCOLLO DI ANCORAGGIO VISIVO (GROUNDING):
   - Prima di formulare qualsiasi domanda guida o commento, devi SEMPRE isolare e TRASCRIVERE LETTERALMENTE il quesito su cui si lavora direttamente dall'immagine (es. "Quesito A10: [testo esatto]").
   - Leggi i pixel reali dell'immagine che hai davanti. È SEVERAMENTE VIETATO ricostruire a memoria brani noti, opzioni o quesiti tipici INVALSI.
   - Rispondi SOLO su ciò che è nitidamente stampato nel documento fornito.

2. GESTIONE IMMAGINE SGRANATA O PARZIALE:
   - Se una parola, un numero, una formula o un'opzione (A, B, C, D) è sfuocata, tagliata o illeggibile, NON TIRARE A INDOVINARE.
   - Dichiara subito con precisione: "Nel documento non riesco a leggere con certezza la riga/opzione X perché sgranata; per favore scatta o carica un ritaglio più ingrandito di quel punto."

3. METODO PEDAGOGICO GUIDATO:
   - NON rivelare mai la soluzione finale o la lettera corretta.
   - Poni domande stimolo brevi, fai notare le parole-chiave nel brano e correggi gli errori di deduzione passo dopo passo.
   - Mantieni un tono incoraggiante e chiaro per studenti di 13-17 anni.

4. FORMATTAZIONE MATEMATICA DA QUADERNO (DIVIETO ASSOLUTO DI LATEX E SIMBOLI DA PROGRAMMATORE):
   - È SEVERAMENTE VIETATO l'uso di delimitatori dollaro ($), barre rovesciate (\\frac, \\sqrt, ecc.) e del cappuccio ^ per le potenze.
   - TABELLA DI SCRITTURA OBBLIGATORIA:
     * POTENZE: USA SEMPRE GLI APICI UNICODE. Scrivi "x²", "4³", "(4/3)²", "(4²)/3", "cm³", "m²". NON scrivere MAI "x^2", "4^3" o "4^2/3".
     * FRAZIONI: Scrivi "a/b" o "1/2" oppure "(numeratore)/(denominatore)". NON scrivere mai "\\frac{a}{b}".
     * RADICI: Usa il simbolo "√" o la parola "radice", es. "√16 = 4", "√(4/9)", oppure "radice(16)". NON scrivere mai "\\sqrt{16}" o "sqrt(16)".
     * MOLTIPLICAZIONI E DIVISIONI: Usa "·" (puntino) o "*" per moltiplicare, e ":" o "/" per dividere (es. "3 · 4 = 12", "12 : 3 = 4").
     * NUMERI MISTI: Esplicita sempre la somma o converti in frazione impropria: scrivi "2 + 1/2" oppure "5/2" (es. "2 unità e 1/2, cioè 5/2"). Evita scritture ambigue come "2 1/2".
     * GEOMETRIA E GRADI: Scrivi "90°", "180°", "π" (Pi greco), "<=" o "≤", ">=" o "≥", "+/-" o "±".

5. AMBITO ESCLUSIVO:
   - Solo Matematica e Italiano INVALSI per Scuola Secondaria I Grado e Primo Biennio II Grado.
   - Rifiuta qualunque richiesta estranea con la formula: "Il mio compito è aiutarti a preparare le prove INVALSI! Torniamo al quesito: cosa ti sembra di questo passaggio?".`;

        // Funzione potenziata che converte automaticamente formule, radici e apici in notazione scolastica
        function cleanMathOutput(text) {
            if (!text) return text;
            let cleaned = text;

            // Mappatura esponenti numerici in apici Unicode
            const superscripts = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '+': '⁺', '-': '⁻', 'n': 'ⁿ', 'x': 'ˣ'
            };

            // Converte simboli di grado LaTeX come ^\circ o \circ in °
            cleaned = cleaned.replace(/\^?\\circ/g, '°');
            cleaned = cleaned.replace(/\\degree/g, '°');

            // Converte radici quadrate: \sqrt[3]{x} -> radice_cubica(x), \sqrt{x} -> √(x), sqrt(x) -> √(x)
            cleaned = cleaned.replace(/\\sqrt\[3\]\{([^{}]+)\}/g, '∛($1)');
            cleaned = cleaned.replace(/\\sqrt\{([^{}]+)\}/g, '√($1)');
            cleaned = cleaned.replace(/\bsqrt\(([^()]+)\)/gi, '√($1)');

            // Converte frazioni LaTeX: \frac{a}{b} -> a/b oppure (a)/(b)
            cleaned = cleaned.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1/$2)');

            // Converte esponenti con cappuccio in apici Unicode: es. x^2 -> x², 16^100 -> 16¹⁰⁰
            cleaned = cleaned.replace(/\^([0-9+\-nx]+)/g, (match, p1) => {
                return p1.split('').map(char => superscripts[char] || char).join('');
            });

            // Se l'esponente era tra graffe o tonde: es. 4^{2} -> 4², 2^(100) -> 2¹⁰⁰
            cleaned = cleaned.replace(/\^[\{\(]([0-9+\-nx]+)[\}\)]/g, (match, p1) => {
                return p1.split('').map(char => superscripts[char] || char).join('');
            });

            // Converte comandi LaTeX frequenti in simboli chiari e scolastici
            cleaned = cleaned
                .replace(/\\times/g, '×')
                .replace(/\\cdot/g, '·')
                .replace(/\\div/g, ':')
                .replace(/\\pm/g, '±')
                .replace(/\\le(q)?\b/g, '≤')
                .replace(/\\ge(q)?\b/g, '≥')
                .replace(/\\neq\b/g, '≠')
                .replace(/\\approx\b/g, '≈')
                .replace(/\\pi\b/g, 'π')
                .replace(/\\left\(/g, '(')
                .replace(/\\right\)/g, ')')
                .replace(/\\left\[/g, '[')
                .replace(/\\right\]/g, ']');

            // Rimuove eventuali backslash isolati rimasti davanti a caratteri o comandi residui
            cleaned = cleaned.replace(/\\([a-zA-Z]+)/g, '$1');

            // Rimuove i delimitatori LaTeX a dollaro singolo o doppio ($x$ -> x, $$formula$$ -> formula)
            cleaned = cleaned.replace(/\$\$([\s\S]*?)\$\$/g, '$1');
            cleaned = cleaned.replace(/\$([^\$\n]+)\$/g, '$1');

            return cleaned;
        }

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [image, setImage] = useState(null);
            const [activeContextImage, setActiveContextImage] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [level, setLevel] = useState('Secondaria I Grado');
            const [isListening, setIsListening] = useState(false);
            const [isSpeechSupported, setIsSpeechSupported] = useState(true);
            
            const scrollRef = useRef(null);
            const fileInputRef = useRef(null);
            const recognitionRef = useRef(null);
            const baseTextRef = useRef('');
            const textareaRef = useRef(null);

            // Simboli matematici e scolastici rapidi (incluso il tasto esponente ^)
            const QUICK_SYMBOLS = ['²', '³', '^', '√', '·', ':', '°', 'π', '≤', '≥', '±', '≠', '∛'];

            const SUPERSCRIPT_MAP = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '+': '⁺', '-': '⁻', 'n': 'ⁿ', 'x': 'ˣ',
                '(': '⁽', ')': '⁾'
            };
            const SUPERSCRIPT_CHARS = '⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿˣ⁽⁾';

            // Conversione automatica istantanea mentre si digita (supporta esponenti a più cifre come ^100 -> ¹⁰⁰)
            const handleInputChange = (e) => {
                const textarea = e.target;
                const rawVal = textarea.value;
                const selStart = textarea.selectionStart;

                let newCursorPos = selStart;
                let modified = false;

                // 1. Converte sequenze introdotte da ^ (es. ^100, ^{100}, ^(100), ^-3)
                let converted = rawVal.replace(/\^[\{\(]?([0-9+\-nx]+)[\}\)]?/g, (match, chars, offset) => {
                    modified = true;
                    const replacement = chars.split('').map(c => SUPERSCRIPT_MAP[c] || c).join('');
                    const diff = match.length - replacement.length;
                    if (offset < selStart) {
                        newCursorPos -= diff;
                    }
                    return replacement;
                });

                // 2. Chaining automatico: qualsiasi cifra/segno digitato subito a ridosso di un apice continua come apice
                const chainPattern = new RegExp(`([${SUPERSCRIPT_CHARS}])([0-9+\\-nx])`, 'g');
                while (chainPattern.test(converted)) {
                    converted = converted.replace(chainPattern, (match, sup, nextChar) => {
                        modified = true;
                        return sup + (SUPERSCRIPT_MAP[nextChar] || nextChar);
                    });
                }

                setInput(converted);

                if (modified) {
                    setTimeout(() => {
                        if (textareaRef.current) {
                            const safePos = Math.max(0, Math.min(newCursorPos, converted.length));
                            textareaRef.current.setSelectionRange(safePos, safePos);
                        }
                    }, 0);
                }
            };

            // Inserisce il simbolo nella posizione attuale del cursore
            const insertSymbol = (sym) => {
                const textarea = textareaRef.current;
                if (!textarea) {
                    setInput(prev => prev + sym);
                    return;
                }
                const start = textarea.selectionStart ?? input.length;
                const end = textarea.selectionEnd ?? input.length;
                const updated = input.substring(0, start) + sym + input.substring(end);
                setInput(updated);

                // Riposiziona il cursore subito dopo il simbolo appena inserito
                setTimeout(() => {
                    textarea.focus();
                    textarea.setSelectionRange(start + sym.length, start + sym.length);
                }, 10);
            };

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [messages, isLoading, image, isListening]);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'it-IT';
                    recognition.continuous = true;
                    recognition.interimResults = true;

                    recognition.onresult = (event) => {
                        let interimTranscript = '';
                        let currentSessionFinal = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                currentSessionFinal += event.results[i][0].transcript;
                            } else {
                                interimTranscript += event.results[i][0].transcript;
                            }
                        }
                        setInput(baseTextRef.current + currentSessionFinal + interimTranscript);
                    };

                    recognition.onstart = () => setIsListening(true);
                    recognition.onend = () => setIsListening(false);
                    recognition.onerror = (event) => {
                        console.error('Errore riconoscimento vocale:', event.error);
                        setIsListening(false);
                    };

                    recognitionRef.current = recognition;
                } else {
                    setIsSpeechSupported(false);
                }
            }, []);

            const toggleListening = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                } else {
                    baseTextRef.current = input + (input.length > 0 && !input.endsWith(' ') ? ' ' : '');
                    try {
                        recognitionRef.current?.start();
                    } catch (e) {
                        console.error("Errore avvio riconoscimento:", e);
                    }
                }
            };

            const handleImage = (file) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onloadend = () => setImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const onPaste = (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        const blob = items[i].getAsFile();
                        handleImage(blob);
                    }
                }
            };

            const sendMessage = async () => {
                if ((!input.trim() && !image) || isLoading) return;
                
                if (isListening) recognitionRef.current?.stop();

                const userMsg = { role: 'user', text: input, image: image };
                setMessages(prev => [...prev, userMsg]);
                
                const currentInput = input;
                const currentImage = image;
                // Mantiene attiva l'immagine corrente nella conversazione fino al caricamento di una nuova
                const imageToUse = currentImage || activeContextImage;
                if (currentImage) {
                    setActiveContextImage(currentImage);
                }

                setInput('');
                setImage(null);
                setIsLoading(true);

                try {
                    const contents = messages.map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [{ text: m.text }]
                    }));

                    const userParts = [{ 
                        text: `[Livello: ${level}] [Modalità: Apprendimento guidato anti-allucinazione]
[REGOLA RIGIDA FORMATTAZIONE: NON usare nessun delimitatore $ o sintassi LaTeX come \\frac. Per le potenze usa SEMPRE apici Unicode come ², ³, (4/3)², (4²)/3 senza cappuccio ^. Per le radici usa √. Scrivi come su un quaderno di scuola media.]
Richiesta/Risposta dello studente: "${currentInput || 'Ho caricato questa pagina di prova INVALSI. Aiutami ad affrontarla passo dopo passo.'}"` 
                    }];

                    // Invia sempre l'immagine del quesito attivo per evitare che nei turni successivi il modello la perda
                    if (imageToUse) {
                        const mimeMatch = imageToUse.match(/^data:([a-zA-Z0-9]+\/[a-zA-Z0-9-.+]+);base64,/);
                        const detectedMime = mimeMatch ? mimeMatch[1] : "image/jpeg";
                        const base64Data = imageToUse.replace(/^data:([a-zA-Z0-9]+\/[a-zA-Z0-9-.+]+);base64,/, '');

                        userParts.push({
                            inlineData: {
                                mimeType: detectedMime,
                                data: base64Data
                            }
                        });
                    }

                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            contents: [...contents, { role: 'user', parts: userParts }],
                            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                        }),
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const rawAiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Errore nella risposta del tutor.";
                    const sanitizedAiText = cleanMathOutput(rawAiText);
                    setMessages(prev => [...prev, { role: 'model', text: sanitizedAiText }]);
                } catch (error) {
                    setMessages(prev => [...prev, { role: 'model', text: "❌ ERRORE: " + error.message }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    {/* Top bar */}
                    <header className="px-6 py-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-xs">
                        <div className="flex items-center gap-2">
                            <span className="h-3 w-3 bg-emerald-500 rounded-full animate-ping"></span>
                            <h1 className="text-lg font-bold text-slate-800 tracking-tight">Tutor INVALSI</h1>
                        </div>
                        <div className="flex items-center gap-2 text-xs font-semibold text-blue-700 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200">
                            <i data-lucide="compass" size="14"></i>
                            <span>Metodo: Apprendimento Guidato</span>
                        </div>
                    </header>

                    {/* Messages viewport */}
                    <main ref={scrollRef} className="flex-1 overflow-y-auto p-6 messages-container">
                        {messages.length === 0 && (
                            <div className="welcome-card">
                                <h2 className="text-xl text-slate-800 mb-4 font-bold">
                                    Ciao studente! 👋 Benvenuto nel tuo tutor per le prove INVALSI.
                                </h2>
                                <p className="text-slate-600 mb-3 font-medium">Come procedere:</p>
                                <ul className="space-y-3 text-slate-600 mb-6 text-sm">
                                    <li className="flex items-center gap-2">
                                        <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs">1</span>
                                        Seleziona il tuo grado scolastico dal selettore in basso.
                                    </li>
                                    <li className="flex items-center gap-2">
                                        <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs">2</span>
                                        Incolla uno screenshot (Ctrl+V) oppure carica la foto del quesito.
                                    </li>
                                    <li className="flex items-center gap-2">
                                        <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs">3</span>
                                        Rispondi alle domande guida del tutor per arrivare al risultato!
                                    </li>
                                </ul>
                                <div className="p-3 bg-blue-50/70 border border-blue-100 rounded-xl text-blue-700 text-sm">
                                    💡 <strong>Nota sul metodo:</strong> Il tutor non ti darà la risposta pronta, ma ragionerà con te passo dopo passo!
                                </div>
                            </div>
                        )}

                        {}
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} mb-5`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl ${
                                    msg.role === 'user' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'bg-white border border-slate-200 text-slate-800 shadow-xs'
                                }`}>
                                    {msg.image && (
                                        <img 
                                            src={msg.image} 
                                            alt="Allegato quesito" 
                                            className="max-w-full rounded-lg mb-2 border border-slate-100 shadow-sm" 
                                        />
                                    )}
                                    <p className="text-sm whitespace-pre-wrap leading-relaxed">{msg.text}</p>
                                </div>
                            </div>
                        ))}
                        {isLoading && (
                            <div className="flex items-center gap-2 text-blue-600 italic text-sm animate-pulse ml-2 py-2">
                                <i data-lucide="loader-2" className="animate-spin" size="16"></i>
                                Il tutor sta analizzando il quesito...
                            </div>
                        )}
                    </main>

                    {}
                    <footer className="p-4 md:p-6 border-t border-slate-200 bg-white">
                        <div className="max-w-4xl mx-auto">
                            {/* Control Bar: Solo grado scolastico */}
                            <div className="flex items-center justify-between gap-4 mb-3 text-xs font-bold text-slate-500 uppercase tracking-wider">
                                <div className="flex items-center gap-2.5">
                                    <label htmlFor="school-level" className="flex items-center gap-1.5 text-slate-600">
                                        <i data-lucide="graduation-cap" size="16"></i>
                                        <span>GRADO SCOLASTICO:</span>
                                    </label>
                                    <select 
                                        id="school-level"
                                        value={level} 
                                        onChange={e => setLevel(e.target.value)} 
                                        className="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-slate-800 font-semibold normal-case outline-none focus:ring-2 focus:ring-blue-500 transition-all text-xs"
                                    >
                                        <option value="Secondaria I Grado">Secondaria I Grado (Medie)</option>
                                        <option value="Secondaria II Grado">Secondaria II Grado (Biennio Superiori)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Barra rapida con simboli matematici cliccabili */}
                            <div className="flex items-center gap-1.5 mb-2.5 overflow-x-auto pb-1 text-xs select-none">
                                <span className="text-slate-400 font-semibold text-[11px] uppercase tracking-wider mr-1 flex items-center gap-1 flex-shrink-0">
                                    <i data-lucide="calculator" size="13"></i> Simboli:
                                </span>
                                {QUICK_SYMBOLS.map((sym, idx) => (
                                    <button
                                        key={idx}
                                        type="button"
                                        onClick={() => insertSymbol(sym)}
                                        className="h-7 min-w-[28px] px-2 rounded-lg bg-slate-100 hover:bg-blue-100 hover:text-blue-700 text-slate-700 font-bold border border-slate-200 hover:border-blue-300 transition-all active:scale-95 flex items-center justify-center shadow-xs"
                                        title={sym === '^' ? 'Esponente (es. digita ^4 per ottenere ⁴)' : `Inserisci ${sym}`}
                                    >
                                        {sym}
                                    </button>
                                ))}
                            </div>

                            {/* Text Input area */}
                            <div className="flex items-center gap-3">
                                <div className="flex-1 relative">
                                    {image && (
                                        <div className="absolute bottom-full left-0 mb-3 p-2 bg-white rounded-xl shadow-xl border border-slate-200 flex items-center gap-3">
                                            <img src={image} alt="Anteprima quesito" className="h-14 w-14 object-cover rounded-lg border" />
                                            <button 
                                                onClick={() => setImage(null)} 
                                                className="bg-rose-50 text-rose-500 hover:bg-rose-100 p-1.5 rounded-full transition-colors"
                                                title="Rimuovi immagine"
                                            >
                                                <i data-lucide="x" size="16"></i>
                                            </button>
                                        </div>
                                    )}
                                    <textarea 
                                        ref={textareaRef}
                                        value={input}
                                        onChange={handleInputChange}
                                        onPaste={onPaste}
                                        onKeyDown={e => { 
                                            if(e.key === 'Enter' && !e.shiftKey) { 
                                                e.preventDefault(); 
                                                sendMessage(); 
                                            } 
                                        }}
                                        placeholder={isListening ? "In ascolto, parla pure..." : "Scrivi la tua domanda o incolla lo screenshot (Ctrl+V)..."}
                                        className={`w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 pr-24 outline-none focus:ring-2 focus:ring-blue-500 transition-all resize-none min-h-[58px] text-slate-800 placeholder-slate-400 text-sm ${
                                            isListening ? 'ring-2 ring-red-200 border-red-300 bg-red-50/20' : ''
                                        }`}
                                        rows="1"
                                    />
                                    <div className="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                        {isSpeechSupported && (
                                            <button 
                                                type="button"
                                                onClick={toggleListening}
                                                className={`p-1.5 rounded-full transition-all ${
                                                    isListening ? 'listening-active' : 'text-slate-400 hover:text-red-500 hover:bg-slate-100'
                                                }`}
                                                title={isListening ? "Interrompi ascolto" : "Dettatura vocale"}
                                            >
                                                <i data-lucide={isListening ? "mic-off" : "mic"} size="20"></i>
                                            </button>
                                        )}
                                        <button 
                                            type="button"
                                            onClick={() => fileInputRef.current?.click()}
                                            className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-100 rounded-full transition-colors"
                                            title="Carica immagine o foto"
                                        >
                                            <i data-lucide="image" size="20"></i>
                                        </button>
                                    </div>
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        onChange={(e) => handleImage(e.target.files[0])} 
                                        accept="image/*" 
                                        className="hidden" 
                                    />
                                </div>
                                <button 
                                    onClick={sendMessage}
                                    disabled={isLoading || (!input.trim() && !image)}
                                    className="bg-blue-600 disabled:bg-slate-300 text-white p-3.5 rounded-2xl hover:bg-blue-700 shadow-md shadow-blue-500/10 transition-all cursor-pointer disabled:cursor-not-allowed"
                                    title="Invia messaggio"
                                >
                                    <i data-lucide="send" size="20"></i>
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
